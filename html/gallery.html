
  <!-- ========================================
       PHOTO GALLERY OVERLAY
       Kept outside header and main
  ========================================= -->

  <div
    class="photo-gallery-overlay"
    id="photoGallery"
    aria-hidden="true"
  >

    <div
      class="photo-gallery-container"
      role="dialog"
      aria-modal="true"
      aria-labelledby="galleryTitle"
    >

      <div class="photo-gallery-header">

        <div>
          <h2 id="galleryTitle">My Gallery</h2>
          <p>A collection of moments and memories.</p>
        </div>

        <button
          class="gallery-close"
          id="closePhotoGallery"
          type="button"
          aria-label="Close gallery"
        >
          &times;
        </button>

      </div>


      <div
        class="photo-gallery-grid"
        id="photoGalleryGrid"
      >
        <!-- Photos generated from photos.json -->
      </div>

    </div>

  </div>
